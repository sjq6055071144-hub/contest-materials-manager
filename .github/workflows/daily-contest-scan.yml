name: Daily official contest source scan

on:
  schedule:
    - cron: '30 0 * * *' # 08:30 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-official-contest-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan official pages
        run: node scripts/scan-official-sites.mjs
      - name: Save scan results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/official-updates.json
          git diff --cached --quiet || git commit -m "chore: refresh official contest source scan"
          git push